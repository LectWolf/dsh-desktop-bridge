<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>桌面桥 · Desktop Bridge</title>
    <style>
      :root {
        --bg: #faf9f7;
        --card: #fff;
        --ink: #1d1c1a;
        --muted: #6f6b63;
        --line: #e7e4de;
        --accent: #2f6bd8;
        --ok: #2f8f5b;
        --warn: #b7791f;
        --danger: #c0392b;
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181a;
          --card: #202225;
          --ink: #ecebe8;
          --muted: #9b968c;
          --line: rgba(255, 255, 255, 0.1);
          --accent: #6d9bf0;
          --ok: #52b788;
          --warn: #d9a441;
          --danger: #e0715f;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--card);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: 0.2px; }
      .sub { color: var(--muted); font-size: 12px; }
      main { max-width: 1080px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
      .strip { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
      .cell { padding: 12px 16px; }
      .cell + .cell { border-left: 1px solid var(--line); }
      .label { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
      .value { font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
      .card h2 { font-size: 13px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .row:last-child { border-bottom: 0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .muted { color: var(--muted); }
      .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; margin-right: 6px; background: var(--muted); }
      .dot.on { background: var(--ok); }
      .dot.wait { background: var(--warn); }
      button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        border-radius: 7px;
        padding: 5px 11px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: color-mix(in oklab, var(--ink) 6%, transparent); }
      button.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
      button.primary:hover { opacity: 0.88; }
      button.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 40%, var(--line)); }
      .actions { display: flex; gap: 6px; flex-wrap: wrap; }
      .empty { padding: 22px 16px; color: var(--muted); text-align: center; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 500; }
      .scroll { max-height: 280px; overflow: auto; }
      .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>桌面桥</h1>
        <div class="sub">主人的电脑 → 服务器 DSH，每次调用都要确认</div>
      </div>
      <div class="sub" id="clock"></div>
    </header>

    <main>
      <section class="strip">
        <div class="cell"><div class="label">在线设备</div><div class="value" id="stat-online">0</div></div>
        <div class="cell"><div class="label">待确认</div><div class="value" id="stat-pending">0</div></div>
        <div class="cell"><div class="label">免问授权</div><div class="value" id="stat-grants">0</div></div>
      </section>

      <section class="card">
        <h2>待确认的调用</h2>
        <div id="pending"></div>
      </section>

      <section class="card">
        <h2>设备</h2>
        <div id="devices"></div>
      </section>

      <section class="card">
        <h2>调用记录</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr><th style="width:150px">时间</th><th>类型</th><th>工具</th><th>结果</th></tr>
            </thead>
            <tbody id="audit"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>策略</h2>
        <div class="row"><span class="muted">允许的根目录</span><span class="mono" id="roots">—</span></div>
        <div class="row"><span class="muted">命令白名单</span><span class="mono" id="allow">—</span></div>
        <div class="row"><span class="muted">免问授权</span><span class="actions"><span class="mono" id="grants">—</span><button class="danger" id="clear-grants">全部撤销</button></span></div>
      </section>
    </main>

    <script>
      const api = (p) => fetch(p).then((r) => r.json())
      const post = (p, body) =>
        fetch(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json())

      const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
      const time = (at) => (at ? new Date(at).toLocaleTimeString('zh-CN', { hour12: false }) : '—')

      async function decide(id, approved, rememberMin) {
        await post('api/decision', { id, approved, rememberMin })
        refresh()
      }

      function renderPending(list) {
        const host = document.getElementById('pending')
        if (!list.length) {
          host.innerHTML = '<div class="empty">没有等待中的调用</div>'
          return
        }
        host.innerHTML = list
          .map(
            (item) => `
          <div class="row">
            <div style="min-width:0">
              <div><span class="dot wait"></span><strong>${esc(item.tool)}</strong> <span class="pill">${esc(item.device)}</span></div>
              <div class="mono muted" style="word-break:break-all">${esc(JSON.stringify(item.args))}</div>
              <div class="muted">${time(item.createdAt)} 发起 · ${Math.max(0, Math.round((item.expiresAt - Date.now()) / 1000))}s 后自动拒绝</div>
            </div>
            <div class="actions">
              <button class="primary" data-id="${esc(item.id)}" data-act="allow">允许</button>
              <button data-id="${esc(item.id)}" data-act="allow30">30 分钟内免问</button>
              <button class="danger" data-id="${esc(item.id)}" data-act="deny">拒绝</button>
            </div>
          </div>`
          )
          .join('')
        host.querySelectorAll('button[data-act]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const act = btn.dataset.act
            if (act === 'allow') decide(btn.dataset.id, true, 0)
            if (act === 'allow30') decide(btn.dataset.id, true, 30)
            if (act === 'deny') decide(btn.dataset.id, false, 0)
          })
        })
      }

      function renderDevices(devices) {
        const host = document.getElementById('devices')
        if (!devices.length) {
          host.innerHTML = '<div class="empty">还没有注册设备</div>'
          return
        }
        host.innerHTML = devices
          .map(
            (d) => `<div class="row">
              <div><span class="dot ${d.online ? 'on' : ''}"></span><strong>${esc(d.name || d.id)}</strong>
                <span class="pill">${esc(d.id)}</span></div>
              <div class="muted">${d.online ? '在线' : '离线'} · 最近 ${d.lastSeen ? new Date(d.lastSeen).toLocaleString('zh-CN') : '—'}</div>
            </div>`
          )
          .join('')
      }

      function renderAudit(entries) {
        const host = document.getElementById('audit')
        if (!entries.length) {
          host.innerHTML = '<tr><td colspan="4" class="empty">还没有记录</td></tr>'
          return
        }
        host.innerHTML = entries
          .map(
            (e) => `<tr>
              <td class="mono">${time(e.at)}</td>
              <td>${esc(e.kind)}</td>
              <td class="mono">${esc(e.tool || '')}</td>
              <td>${esc(e.decision || (e.ok ? 'ok' : e.error || 'failed'))}</td>
            </tr>`
          )
          .join('')
      }

      async function refresh() {
        const state = await api('api/state')
        document.getElementById('stat-online').textContent = state.online.length
        document.getElementById('stat-pending').textContent = state.pending.length
        document.getElementById('stat-grants').textContent = state.grants.length
        renderPending(state.pending)
        renderDevices(state.devices)
        document.getElementById('roots').textContent = (state.limits.roots || []).join('  ·  ') || '未配置'
        document.getElementById('allow').textContent = (state.limits.allow || []).join('  ·  ') || '未配置'
        document.getElementById('grants').textContent = (state.grants || [])
          .map((g) => `${g.tool} → ${new Date(g.until).toLocaleTimeString('zh-CN', { hour12: false })}`)
          .join('  ·  ') || '无'
        renderAudit((await api('api/audit')).entries)
      }

      document.getElementById('clear-grants').addEventListener('click', async () => {
        await post('api/grants/clear', {})
        refresh()
      })

      setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleString('zh-CN', { hour12: false })
      }, 1000)
      refresh()
      setInterval(refresh, 2000)
    </script>
  </body>
</html>
